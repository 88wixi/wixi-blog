name = "wixi-api"
main = "index.js"
compatibility_date = "2024-09-01"
workers_dev = true # 保留 workers.dev 地址备用；国内走下面的自定义域

# 与照片 Worker 同一套路：workers.dev 在国内被墙，绑到 wixi88.xyz 的子域。
# wrangler deploy 会自动在该 zone 建好 DNS 记录与证书。
[[routes]]
pattern = "api.wixi88.xyz"
custom_domain = true

# 计数存储。binding 名必须是 KV，跟 index.js 里的 env.KV 对应。
[[kv_namespaces]]
binding = "KV"
id = "b1ba1c8b5f83461b801e61c8144e604b"
