name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 让发布流程显性、可追踪：每次推到 main 都会在仓库的 Actions 里留下记录。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布，新推送会取消进行中的旧发布。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # GitHub Pages 是子路径站点（/wixi-blog/），用 VITE_BASE 注入。
      - run: pnpm build
        env:
          VITE_BASE: /wixi-blog/

      # SPA 深链兜底：未知路径回退到 index.html，由前端路由接管。
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
